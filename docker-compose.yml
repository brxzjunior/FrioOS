services:
  backend:
    build:
      context: ./backend
    ports:
      - "3333:3333"
    env_file:
      - ./backend/.env
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

frontend:
  build:
    context: ./frontend
    args:
      - VITE_API_URL=http://localhost:3333
  ports:
    - "4173:80"
  depends_on:
    - backend
  restart: unless-stopped

volumes:
  sqlite_data:
